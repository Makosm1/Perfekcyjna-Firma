.przycisk-ustawienia:hover img {

/* PRZYCIEMNIENIE STRONY */

.tlo-ustawienia {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
    z-index: 1999;
}

.tlo-ustawienia.otwarte {
    opacity: 1;
    visibility: visible;
}

/* OKIENKO NA ŚRODKU EKRANU */

.okno-ustawienia {
    position: fixed;
    top: 50%;
    left: 50%;
    width: min(600px, calc(100vw - 40px));
    height: min(450px, calc(100vh - 40px));
    box-sizing: border-box;

    background: #1b1b1b;
    border: 1px solid #333333;
    border-radius: 22px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);

    opacity: 0;
    visibility: hidden;
    transform: translate(-50%, -46%) scale(0.96);

    transition:
        opacity 0.3s ease,
        transform 0.3s ease,
        visibility 0.3s ease;

    z-index: 2000;
}

.okno-ustawienia.otwarte {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, -50%) scale(1);
}

<script>
    // MENU PODCZAS SCROLLOWANIA

    const menu = document.querySelector(".menu");

    function aktualizujMenu() {
        if (window.scrollY > 50) {
            menu.classList.add("scrolled");
        } else {
            menu.classList.remove("scrolled");
        }
    }

    window.addEventListener("scroll", aktualizujMenu);
    aktualizujMenu();

    // OKIENKO USTAWIEŃ

    const przycisk = document.getElementById("przyciskUstawienia");
    const okno = document.getElementById("oknoUstawienia");
    const tlo = document.getElementById("tloUstawienia");

    function zamknijUstawienia() {
        okno.classList.remove("otwarte");
        tlo.classList.remove("otwarte");
        przycisk.setAttribute("aria-expanded", "false");
        przycisk.focus();
    }

    przycisk.addEventListener("click", function() {
        const otwarte = okno.classList.toggle("otwarte");

        tlo.classList.toggle("otwarte", otwarte);
        przycisk.setAttribute("aria-expanded", String(otwarte));
    });

    tlo.addEventListener("click", zamknijUstawienia);

    document.addEventListener("keydown", function(event) {
        if (event.key === "Escape" &&
            okno.classList.contains("otwarte")) {
            zamknijUstawienia();
        }
    });


// ZMIANA MOTYWU

const przyciskiMotywu = document.querySelectorAll("[data-motyw]");
const przyciskiTekstu = document.querySelectorAll("[data-tekst]");

function ustawMotyw(motyw) {
    document.body.classList.toggle("jasny-motyw", motyw === "jasny");

    przyciskiMotywu.forEach(function(przycisk) {
        const aktywny = przycisk.dataset.motyw === motyw;

        przycisk.classList.toggle("aktywna", aktywny);
        przycisk.setAttribute("aria-pressed", String(aktywny));
    });

    localStorage.setItem("pf-motyw", motyw);
}

przyciskiMotywu.forEach(function(przycisk) {
    przycisk.addEventListener("click", function() {
        ustawMotyw(przycisk.dataset.motyw);
    });
});

// ZMIANA WIELKOŚCI TEKSTU

function ustawTekst(rozmiar) {
    document.body.classList.remove("tekst-maly", "tekst-duzy");

    if (rozmiar === "maly") {
        document.body.classList.add("tekst-maly");
    }

    if (rozmiar === "duzy") {
        document.body.classList.add("tekst-duzy");
    }

    przyciskiTekstu.forEach(function(przycisk) {
        const aktywny = przycisk.dataset.tekst === rozmiar;

        przycisk.classList.toggle("aktywna", aktywny);
        przycisk.setAttribute("aria-pressed", String(aktywny));
    });

    localStorage.setItem("pf-tekst", rozmiar);
}

przyciskiTekstu.forEach(function(przycisk) {
    przycisk.addEventListener("click", function() {
        ustawTekst(przycisk.dataset.tekst);
    });
});

// WCZYTYWANIE ZAPISANYCH USTAWIEŃ

const zapisanyMotyw = localStorage.getItem("pf-motyw");
const zapisanyTekst = localStorage.getItem("pf-tekst");

ustawMotyw(zapisanyMotyw === "jasny" ? "jasny" : "ciemny");

ustawTekst(
    ["maly", "normalny", "duzy"].includes(zapisanyTekst)
        ? zapisanyTekst
        : "normalny"
);


</script>
